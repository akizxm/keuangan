async function api(b){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,token:TOK})});return r.json()}

function status(){const p=$('#st');if(!p)return;let c='ok',t='Tersinkron';if(busy){c='sy';t='Menyimpan…'}else if(Q.length){c='q';t='Antre '+Q.length}else if(!navigator.onLine){c='off';t='Offline'}p.className='pill '+c;p.textContent=tr(t)}
function enqueue(j){Q.push(j);SV('q',Q);status();flush()}
function undoQueue(action,id,delAct,delKey){
  const start=busy?1:0,qi=Q.findIndex((q,i)=>i>=start&&q.action===action&&(q.tx?.id===id||q.tr?.id===id));
  if(qi>=0){Q.splice(qi,1);SV('q',Q);status()}else enqueue({action:delAct,[delKey]:id});
}
async function flush(){
  if(busy||!Q.length)return;busy=true;status();let n=0;
  while(Q.length){let r;try{r=await api(Q[0])}catch(e){busy=false;status();toast('Disimpan di HP, akan dikirim otomatis saat ada sinyal');return}
    if(!r.ok){if(r.error==='AUTH'){busy=false;return logout('Sesi habis, masuk lagi')}toast(r.error||'Gagal menyimpan','err')}else n++;
    Q.shift();SV('q',Q)}
  busy=false;status();if(n)toast('Tersimpan di Google Sheets ✓','ok');await refresh()}
async function refresh(){
  try{const r=await api({action:'bootstrap'});if(Q.length)return;if(!r.ok){if(r.error==='AUTH')return logout('Sesi habis, masuk lagi');throw new Error(r.error)}D=r;recalc();SV('d',D);render()}
  catch(e){if(!D)$('#main').innerHTML=empty('Gagal memuat data',nerr(e)+'. Tekan ↻ untuk coba lagi.');else toast(nerr(e),'err')}status()}

};
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function localParse(text){
  let s=String(text||'').trim();if(!s||s.length>140||/[?]|(\b(atau|kira|lupa|kurang lebih|sekitar)\b)/i.test(s))return null;
  const td=today();let tanggal=td;
  if(/\bkemarin\b/i.test(s)){tanggal=addD(td,-1);s=s.replace(/\bkemarin\b/gi,' ')}
  else if(/\bhari ini\b/i.test(s)){s=s.replace(/\bhari ini\b/gi,' ')}
  let jam='';
  s=s.replace(/\b(?:jam|pukul)\s*(\d{1,2})(?:[:.](\d{2}))?\s*(pagi|siang|sore|malem|malam)?\b/i,(_,hh,mm,p)=>{
    let h=+hh;if(h>=0&&h<=23){if(p){const pl=p.toLowerCase();if((pl==='sore'||pl==='malem'||pl==='malam')&&h<12)h+=12;else if(pl==='siang'&&h>=1&&h<=5)h+=12;else if((pl==='pagi'||pl==='malam'||pl==='malem')&&h===12)h=pl==='pagi'?12:0}jam=String(h).padStart(2,'0')+':'+(mm||'00')}return' '});
  if(!jam)s=s.replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/,(_,hh,mm)=>{jam=hh.padStart(2,'0')+':'+mm;return' '});
  const noms=[];
  let work=s.replace(/(?:^|\s)(?:rp\.?\s*)?(\d+(?:[.,]\d+)?)\s*(juta|jt|ribu|rb|k)\b/gi,(m,n,u)=>{const U={juta:1e6,jt:1e6,ribu:1e3,rb:1e3,k:1e3};noms.push(Math.round(parseFloat(n.replace(',','.'))*U[u.toLowerCase()]));return' '});
  work=work.replace(/\brp\.?\s*(\d{1,3}(?:[.,]\d{3})+|\d+)\b/gi,(_,n)=>{noms.push(parseInt(n.replace(/[.,]/g,''),10));return' '});
  work=work.replace(/\b(\d{1,3}(?:\.\d{3})+)\b/g,(_,n)=>{noms.push(parseInt(n.replace(/\./g,''),10));return' '});
  if(!noms.length)work=work.replace(/(^|\s)(\d{4,9})(?=\s|$)/g,(_,sp,n)=>{noms.push(parseInt(n,10));return sp});
  const cn=noms.filter(v=>v>0);if(cn.length!==1)return null;
  const nominal=cn[0],isTrf=/\b(tf|transfer|pindah|pindahin)\b/i.test(work),wHits=[],wSorted=D.dompet.map(w=>w.nama).sort((a,b)=>b.length-a.length);
  wSorted.forEach(w=>{const re=new RegExp('\\b'+escRe(w)+'\\b','gi');let m;while((m=re.exec(work))!==null)if(!wHits.some(h=>m.index<h.end&&m.index+m[0].length>h.idx))wHits.push({w,idx:m.index,end:m.index+m[0].length})});
  wHits.sort((a,b)=>a.idx-b.idx);
  if(isTrf){
    const uw=[];wHits.forEach(h=>{if(!uw.length||uw[uw.length-1]!==h.w)uw.push(h.w)});
    if(uw.length>=2){
      let dari='',ke='';wSorted.forEach(w=>{if(!dari&&new RegExp('\\bdari\\s+'+escRe(w)+'\\b','i').test(work))dari=w;if(!ke&&new RegExp('\\b(?:ke|->)\\s*'+escRe(w)+'\\b','i').test(work))ke=w});
      if(!dari)dari=uw.find(w=>w!==ke)||uw[0];if(!ke)ke=uw.find(w=>w!==dari)||uw[1];
      if(dari&&ke&&dari!==ke){let note=work.replace(/\b(tf|transfer|pindah|pindahin|dari|ke)\b|->/gi,' ');[dari,ke].forEach(w=>{note=note.replace(new RegExp('\\b'+escRe(w)+'\\b','gi'),' ')});return{jenis:'transfer',nominal,kategori:'Transfer',dompet:null,dari,ke,catatan:note.replace(/\s+/g,' ').trim().slice(0,100),tanggal,jam}}
    }
    return null;
  }
  if(wHits.length>1)return null;
  const dompet=wHits.length===1?wHits[0].w:null;
  if(dompet)work=work.replace(new RegExp('\\b(?:dari|ke|pake|pakai|via|di|lewat|masuk)?\\s*'+escRe(dompet)+'\\b','gi'),' ');
  const low=work.toLowerCase();
  let jenis=/\b(gaji|gajian|bonus|thr|terima|dapat|pemasukan|masuk|refund|cashback|dividen|honor|topup|top up)\b/i.test(low)?'masuk':'keluar';
  const findCat=j=>{
    const list=D.kategori.filter(k=>k.jenis===j).map(k=>k.nama);
    for(const c of list)if(new RegExp('\\b'+escRe(c)+'\\b','i').test(low))return c;
    for(const cn2 in CAT_KW[j])for(const kw of CAT_KW[j][cn2])if(new RegExp('\\b'+escRe(kw)+'\\b','i').test(low))return list.find(c=>c.toLowerCase()===cn2.toLowerCase())||cn2;
    return''};
  let kategori=findCat(jenis);if(!kategori&&jenis==='keluar'){const ic=findCat('masuk');if(ic){jenis='masuk';kategori=ic}}
  const note=work.replace(/\b(dari|ke|pake|pakai|via|masuk|beli|bayar)\b/gi,' ').replace(/\s+/g,' ').trim().slice(0,100);
  if(!kategori){const ws=note?note.split(' '):[];if(!ws.length||ws.length>3)return null;kategori='Lainnya'}
  return{jenis,nominal,kategori,dompet,dari:null,ke:null,catatan:note||kategori.toLowerCase(),tanggal,jam};
}

login:async()=>{const u=$('#lu').value.trim(),p=$('#lp').value;if(!u||!p)return toast('Isi URL dan PIN','err');API=u;const b=$('#lb');b.textContent='Memeriksa…';
  try{const r=await api({action:'login',pin:p});if(r.ok){TOK=r.token;localStorage.api=u;localStorage.tok=TOK;start()}else toast(r.error,'err')}catch(e){toast('Tidak bisa terhubung. Cek URL dan sinyal.','err')}b.textContent=tr('Masuk akun')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el);else if(e.target.id==='sheet')closeSheet()});
document.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('money')){const v=t.value.replace(/\D/g,'');t.value=v?(+v).toLocaleString('id-ID'):''}
  const k=t.dataset.h;if(!k)return;if(k==='nm'){cfg.name=t.value;saveCfg();return}if(k==='cf'){cf=t.value;render()}else if(k==='ct'){ct=t.value;render()}else{H[k]=t.value;list()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='ai')A.ask();if(e.target.id==='lp')A.login()}});

let BV=null;
async function chkBackend(){try{const r=await api({action:'ping'});BV=r.v||0}catch(e){return}if(BV<4)toast('Backend Apps Script belum versi terbaru (piutang, jam, dan perbaikan AI butuh update)','err')}
function shrink(f){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7).split(',')[1])};im.onerror=()=>no(new Error('Foto tidak bisa dibaca'));im.src=u})}
async function scan(f,inp){if(!f)return;if(!navigator.onLine){inp.value='';return toast('Scan struk butuh internet','err')}
  $('#pv').innerHTML='<div class="pvc">⏳ Membaca struk…</div>';
  try{const r=await api({action:'ai_receipt',image:await shrink(f),mime:'image/jpeg'});if(!r.ok){if(r.error==='AUTH')return logout('Sesi habis, masuk lagi');throw new Error(r.error)}pv(r.data,0)}catch(e){if($('#pv'))$('#pv').innerHTML='';toast(nerr(e),'err')}inp.value=''}
document.addEventListener('change',e=>{if(e.target.id==='rc')scan(e.target.files[0],e.target)});
/* ---------- mulai ---------- */
function logout(m){TOK='';localStorage.removeItem('tok');localStorage.removeItem('d');D=null;Q=[];SV('q',Q);closeSheet();$('#shell').classList.add('hide');$('#login').classList.remove('hide');$('#lu').value=API;if(m)toast(m,'err')}
function start(){$('#login').classList.add('hide');$('#shell').classList.remove('hide');render();Q.length?flush():refresh();chkBackend()}
applyCfg();chrome();
if(API&&TOK)start();else $('#login').classList.remove('hide');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
